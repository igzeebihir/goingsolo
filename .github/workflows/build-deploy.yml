name: Build, test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gd, pdo_sqlite, sqlite3, mbstring, xml, zip, curl, bcmath, intl
          tools: composer:v2

      - name: Install dependencies
        run: |
          if [ -f composer.lock ]; then
            composer install --no-interaction --no-progress --prefer-dist
          else
            composer update --no-interaction --no-progress --prefer-dist
          fi

      - name: Keep the lock file
        uses: actions/upload-artifact@v4
        with:
          name: composer-lock
          path: composer.lock

      - name: Install the site with SQLite
        run: |
          cp deploy/settings.php web/sites/default/settings.php
          mkdir -p private/files
          cat > private/secrets.php <<'PHP'
          <?php
          $databases['default']['default'] = ['driver' => 'sqlite', 'database' => '/tmp/goingsolo.sqlite', 'prefix' => '', 'namespace' => 'Drupal\\sqlite\\Driver\\Database\\sqlite', 'autoload' => 'core/modules/sqlite/src/Driver/Database/sqlite/'];
          $settings['hash_salt'] = 'ci-only';
          PHP
          set -o pipefail
          mkdir -p /tmp/ci-logs
          {
            vendor/bin/drush site:install goingsolo --site-name=goingsolo.ie --account-pass=ci -y
            vendor/bin/drush pm:install goingsolo_commerce goingsolo_seo -y
            vendor/bin/drush pathauto:aliases-generate create all -y || true
            vendor/bin/drush cache:rebuild
          } 2>&1 | tee /tmp/ci-logs/install.log

      - name: Smoke test pages
        run: |
          mkdir -p /tmp/ci-logs
          exec > >(tee /tmp/ci-logs/smoke.log) 2>&1
          cd web
          php -S 127.0.0.1:8080 .ht.router.php > /tmp/server.log 2>&1 &
          sleep 3
          fail=0
          for path in / /deals /guides /county/galway /membership /membership/monthly /membership/annual /providers/pro /providers/featured-listing /list-your-offer /about /ads.txt /sitemap.xml /user/register; do
            code=$(curl -s -o /tmp/page.html -w '%{http_code}' "http://127.0.0.1:8080$path")
            echo "$code $path"
            if [ "$code" != "200" ]; then fail=1; grep -o '<title>[^<]*' /tmp/page.html || true; fi
          done
          cd ..
          vendor/bin/drush watchdog:show --severity=Error --count=20 || true
          exit $fail

      - name: Test a membership purchase
        run: |
          set -o pipefail
          mkdir -p /tmp/ci-logs
          vendor/bin/drush php:script deploy/ci-checkout-test.php 2>&1 | tee /tmp/ci-logs/checkout.log

      - name: Save logs and lock file to the ci-output branch
        if: always() && github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/ci-logs
          cp composer.lock /tmp/ci-logs/ 2>/dev/null || true
          vendor/bin/drush watchdog:show --count=50 > /tmp/ci-logs/watchdog.log 2>&1 || true
          cd /tmp/ci-logs
          git init -q -b ci-output
          git -c user.name=ci -c user.email=ci@localhost add -A
          git -c user.name=ci -c user.email=ci@localhost commit -q -m "CI output for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-output

      - name: Package the build
        if: github.event_name != 'pull_request'
        run: |
          chmod -R u+w web/sites/default
          rm -rf web/sites/default/settings.php web/sites/default/files private
          composer install --no-dev --no-interaction --no-progress --prefer-dist --optimize-autoloader
          tar czf /tmp/build.tgz --exclude=.git --exclude=web/sites/default/files .
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: build
          path: /tmp/build.tgz
          retention-days: 3

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: hostinger
    steps:
      - name: Check deploy settings
        id: check
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          if [ -z "$SSH_HOST" ]; then
            echo "No SSH_HOST secret yet, so nothing is deployed."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v4
        if: steps.check.outputs.ready == 'true'
        with:
          name: build

      - name: Upload and update the site
        if: steps.check.outputs.ready == 'true'
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SITE_DOMAIN: ${{ vars.SITE_DOMAIN || 'staging.ohalloran.in' }}
          SITE_WEBROOT: ${{ vars.SITE_WEBROOT }}
          SITE_MAIL: ${{ vars.SITE_MAIL }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/deploy-logs
          exec > >(tee /tmp/deploy-logs/deploy.log) 2>&1
          if [ -z "${SITE_DOMAIN:-}" ]; then echo "Set the SITE_DOMAIN variable." >&2; exit 1; fi
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "${SSH_PORT:-22}" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          SSH="ssh -i $HOME/.ssh/id_deploy -p ${SSH_PORT:-22} -o StrictHostKeyChecking=yes -o BatchMode=yes"
          TARGET="$SSH_USER@$SSH_HOST"

          # Work out where the domain's web root is. A main domain uses
          # domains/<domain>/public_html; a Hostinger subdomain usually uses
          # domains/<parent>/public_html/<sub>.
          PATHS=$($SSH "$TARGET" "SITE_DOMAIN='$SITE_DOMAIN' SITE_WEBROOT='${SITE_WEBROOT:-}' bash -s" <<'SH'
          set -e
          D="$SITE_DOMAIN"; SUB="${D%%.*}"; PARENT="${D#*.}"
          if [ -n "$SITE_WEBROOT" ]; then
            WEBROOT="$SITE_WEBROOT"; APP="$(dirname "$SITE_WEBROOT")/goingsolo-$D"
          elif [ -e "$HOME/domains/$D/public_html" ]; then
            WEBROOT="domains/$D/public_html"; APP="domains/$D/goingsolo"
          elif [ -e "$HOME/domains/$PARENT/public_html/$SUB" ]; then
            WEBROOT="domains/$PARENT/public_html/$SUB"; APP="domains/$PARENT/goingsolo-$SUB"
          else
            echo "Could not find the web root for $D. Folders in ~/domains:" >&2
            ls -la "$HOME/domains" >&2 || true
            ls -la "$HOME/domains/$PARENT/public_html" >&2 || true
            exit 1
          fi
          echo "$WEBROOT|$APP"
          SH
          )
          WEBROOT="${PATHS%%|*}"; APP="${PATHS##*|}"
          echo "Web root: ~/$WEBROOT  App: ~/$APP"

          mkdir build && tar xzf build.tgz -C build
          $SSH "$TARGET" "mkdir -p $APP"
          rsync -az --delete \
            --exclude 'web/sites/default/files/' \
            --exclude 'web/sites/default/settings.php' \
            --exclude 'private/' \
            -e "$SSH" build/ "$TARGET:$APP/"

          # Point the web root at Drupal's web folder, keeping whatever was there.
          $SSH "$TARGET" "set -e; cd \$HOME; if [ -e $WEBROOT ] && [ ! -L $WEBROOT ]; then mv $WEBROOT $WEBROOT.before-goingsolo.\$(date +%s); fi; ln -sfn \$HOME/$APP/web $WEBROOT"

          $SSH "$TARGET" \
            "DB_NAME='${DB_NAME:-}' DB_USER='${DB_USER:-}' DB_PASS='${DB_PASS:-}' SITE_MAIL='${SITE_MAIL:-hello@goingsolo.ie}' bash \$HOME/$APP/deploy/remote.sh \$HOME/$APP '$SITE_DOMAIN'"

      - name: Check the live site
        if: steps.check.outputs.ready == 'true'
        env:
          SITE_DOMAIN: ${{ vars.SITE_DOMAIN || 'staging.ohalloran.in' }}
        run: |
          exec > >(tee /tmp/deploy-logs/live.log) 2>&1
          echo "DNS for $SITE_DOMAIN:"; dig +short A "$SITE_DOMAIN" || true
          echo "Name servers for ${SITE_DOMAIN#*.}:"; dig +short NS "${SITE_DOMAIN#*.}" || true
          echo "A record for ${SITE_DOMAIN#*.}:"; dig +short A "${SITE_DOMAIN#*.}" || true
          curl -sv -o /dev/null "https://$SITE_DOMAIN/" 2>&1 | grep -E '^\* |^< HTTP' | head -15 || true
          for path in / /deals /guides /county/galway /membership /membership/monthly /providers/featured-listing /ads.txt /sitemap.xml /user/login; do
            echo "$(curl -s -o /tmp/page.html -w '%{http_code} %{time_total}s' "https://$SITE_DOMAIN$path") $path $(grep -o '<title>[^<]*' /tmp/page.html | head -1)"
          done
          curl -sI "https://$SITE_DOMAIN/" | head -15

      - name: Save deploy log to the deploy-output branch
        if: always() && steps.check.outputs.ready == 'true'
        run: |
          mkdir -p /tmp/deploy-logs && cd /tmp/deploy-logs
          git init -q -b deploy-output
          git -c user.name=ci -c user.email=ci@localhost add -A
          git -c user.name=ci -c user.email=ci@localhost commit -q --allow-empty -m "Deploy output for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" deploy-output
