- title: 'Dublin Literary Pub Crawl'
  provider: 'Dublin Literary Pub Crawl'
  type: 'Walking tour'
  county: Dublin
  town: Dublin
  duration: 'An evening'
  summary: 'Two actors lead a walk between historic Dublin pubs, performing scenes from Joyce, Beckett, Behan and Wilde along the way.'
  description: |
    One of Dublin's longest-running evening tours. You meet at a city-centre pub, then walk with the group between pubs connected to the city's writers while two actors perform short scenes and tell the stories behind them.

    There is a quiz along the way, which is an easy way to get talking to the people around you.
  tip: 'It gives you a ready-made group for the evening. You walk and drink with the same people for a few hours, and the performances give everyone something to talk about.'
  url: 'https://www.discoverireland.ie/dublin/dublin-literary-pub-crawl'
  lat: 53.3417
  lng: -6.2593
  last_checked: '2026-10-30'
  source: 'Discover Ireland listing'

- title: 'The Wicklow Tour with Hilltoptreks'
  provider: 'Hilltoptreks'
  type: 'Guided tour or day trip'
  county: Wicklow
  town: Glendalough
  duration: 'Full day from Dublin'
  summary: 'A small-group day trip from Dublin into the Wicklow Mountains, with time to walk at Glendalough.'
  description: |
    A day out of the city in the Wicklow Mountains, including the monastic site and lakes at Glendalough, with guided walking along the way. Transport from Dublin is included, so you do not need a car.
  tip: 'Getting to the Wicklow Mountains without a car is awkward on your own. A small-group tour solves the transport and gives you company on the walk.'
