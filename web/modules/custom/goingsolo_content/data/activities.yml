- title: 'Cork Fab Food Trail'
  provider: 'Fab Food Trails'
  type: 'Food and drink'
  county: Cork
  town: Cork
  duration: 'A few hours'
  summary: 'A guided tasting walk through Cork city, including the English Market, meeting producers and traders along the way.'
  description: |
    Cork calls itself Ireland's food capital, and the English Market is the heart of it. The trail introduces you to traders, producers and food spots around the city centre, with tastings as you go.
  tip: 'Eating alone can be the hardest part of a solo trip. A food tour gives you a group to taste and talk with, and a list of places to come back to.'
