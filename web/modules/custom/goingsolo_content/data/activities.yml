  lat: 53.0103
  lng: -6.3297
  last_checked: '2026-10-30'
  source: 'Discover Ireland listing'

- title: 'Doolin Cliff Walk Guided Tour'
  provider: 'Doolin Cliff Walk'
  type: 'Walking tour'
  county: Clare
  town: Doolin
  duration: 'About three hours'
  summary: 'A guided walk from Doolin along the coastal path towards the Cliffs of Moher, led by a local farmer.'
  description: |
    The walk starts in Doolin and follows the cliff path south through farmland towards the Cliffs of Moher, with stories about the land, the families who farm it and the wildlife along the coast.
  tip: 'The cliff path is exposed and not always well marked. Walking it with a guide means you can enjoy it without worrying about the route, and you set off as a group.'
  url: 'https://www.discoverireland.ie/clare/doolin-cliff-walk-guided-tour'
  lat: 53.0177
  lng: -9.4027
  last_checked: '2026-10-30'
  source: 'Discover Ireland listing'

- title: 'Surf lessons at Strandhill Surf School'
  provider: 'Strandhill Surf School'
  type: 'Outdoors and adventure'
  county: Sligo
  town: Strandhill
  duration: 'Around two hours'
  summary: 'Beginner surf lessons on one of the west coast''s best-known surf beaches, with wetsuit and board included.'
  description: |
    Strandhill is a small surf village a short drive from Sligo town, with a long beach facing the Atlantic and Knocknarea behind it. Lessons cover the basics on the sand before you head into the water.

    Afterwards, the village has cafés and a seaweed bath house, which is a good way to warm up.
  tip: 'Group lessons put you in the water with others at the same level, and surf villages are sociable places to be on your own.'
  url: 'https://discoverireland.ie/sligo/strandhill-surf-school'
  lat: 54.2711
  lng: -8.6066
  last_checked: '2026-10-30'
  source: 'Discover Ireland listing'

- title: 'Kilkenny Walking Tours'
  provider: 'Pat Tynan Kilkenny Walking Tours'
  type: 'Walking tour'
  county: Kilkenny
  town: Kilkenny
  duration: 'About an hour'
  summary: 'A guided walk through Kilkenny''s medieval streets with a local guide, starting from the Tholsel on High Street.'
  description: |
