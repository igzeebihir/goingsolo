  summary: 'Guided hiking, cycling and island-hopping trips across Ireland. Solo travellers who share a room with a guest of the same gender pay no supplement.'
  description: |
    Wilderness Ireland runs more than 20 small-group trips in Ireland, from Connemara and Kerry hiking to island hopping and cycling. Most trips include guides, accommodation, transport during the trip, most meals and activities.

    Solo travellers are not automatically charged a single supplement. If you are happy to share with another guest of the same gender, the advertised price is what you pay. A limited number of private single rooms are available for a supplement on most trips, first come, first served.

    Women-only departures are available, and the company says guests in their 50s, 60s and beyond are well represented.
