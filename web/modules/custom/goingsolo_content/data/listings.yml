- title: 'Solo Sojourn at Cashel Palace'
  provider: 'Cashel Palace Hotel'
  town: Cashel
  county: Tipperary
  type: Country house hotel
  price: 369
  price_basis: 'per night, with breakfast and dinner'
  supplement: reduced
  features: [meals_included, spa]
  summary: 'A one-night solo package at a five-star country house below the Rock of Cashel, priced at a special single-occupancy rate.'
  description: |
    Cashel Palace's Solo Sojourn package is built for one. You get a night in a King Room at a special single-occupancy rate, full Irish breakfast in the Queen Anne Room and a two-course dinner in the Snug at Mikey Ryan's, the hotel's pub across the street.

    Small touches make it feel like a treat rather than a compromise: two magazines or newspapers of your choice waiting in the room, a candle to take home and 20% off Bamford and Valmont products in the spa.

    You can add a seaweed bath, a spa treatment, a private yoga or meditation session, a guided hike or a pottery class, and the hotel can arrange a transfer from Thurles or Limerick Junction stations if you're coming by train.
  url: 'https://www.cashelpalacehotel.ie/news/hotel-news/the-power-of-one-cashel-palace-hotel-unveils-new'
  last_checked: '2026-10-29'
  lat: 52.5167
  lng: -7.8853
  source: 'Hotel website, Solo Sojourn package page'

- title: 'Solo Traveller Package at The Maritime, Bantry'
  provider: 'The Maritime Hotel'
  town: Bantry
  county: Cork
  type: Hotel
  price: 115
  price_basis: 'per night, B&B for one'
  supplement: none
  features: [spa, meals_included]
  summary: 'A night for one on Bantry Bay with full Irish breakfast, leisure centre and parking included.'
  description: |
    The Maritime's Solo Traveller Package is priced for one person, so there's no single supplement to worry about. It includes your room, a full Irish breakfast, use of the leisure centre and free parking.

    Bantry is a good base for West Cork: Bantry House and Garden is a short walk away, the Sheep's Head and Beara peninsulas are close by, and the town has a Friday market.

    Free cancellation up to 48 hours before arrival.
  url: 'https://www.themaritime.ie/en/solo-traveller-hotel-breaks/'
  last_checked: '2026-10-29'
  lat: 51.6802
  lng: -9.4527
  source: 'Hotel website, Solo Traveller page'

