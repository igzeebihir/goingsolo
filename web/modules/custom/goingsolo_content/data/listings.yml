- title: 'Small-group walking and cycling holidays with no forced supplement'
  provider: 'Wilderness Ireland'
  town: 'Galway (tours nationwide)'
  county: Galway
  type: Walking or activity holiday
  price_basis: 'Per person, guided small-group trips'
  supplement: share
  features: [group_activities, women_only, meals_included, public_transport]
  summary: 'Guided hiking, cycling and island-hopping trips across Ireland. Solo travellers who share a room with a guest of the same gender pay no supplement.'
  description: |
    Wilderness Ireland runs more than 20 small-group trips in Ireland, from Connemara and Kerry hiking to island hopping and cycling. Most trips include guides, accommodation, transport during the trip, most meals and activities.

    Solo travellers are not automatically charged a single supplement. If you are happy to share with another guest of the same gender, the advertised price is what you pay. A limited number of private single rooms are available for a supplement on most trips, first come, first served.

    Women-only departures are available, and the company says guests in their 50s, 60s and beyond are well represented.
  url: 'https://www.wildernessireland.com/solo-holidays/'
  last_checked: '2026-10-29'
  lat: 53.2743
  lng: -9.0490
  source: 'Operator website, solo holidays page'

- title: 'Donegal and the Wild Atlantic Way for Solo Travellers'
  provider: 'Shearings'
  town: Mullaghmore
  county: Sligo
  type: Guided tour
  price_basis: 'From £1,229 per person, 6 days by coach and ferry from Britain'
  supplement: none
  features: [single_rooms, group_activities, meals_included]
  summary: 'A six-day escorted coach tour for solo travellers from Britain, with your own room at no extra cost.'
  description: |
    Shearings runs this tour specifically for people travelling alone. Everyone gets sole use of their own room with no single supplement. Three nights are spent at the Pier Head Hotel in Mullaghmore, Co. Sligo, with excursions along the Donegal and Sligo coast.

    The tour joins from regional points in Britain and travels via Holyhead and the ferry, so it suits visitors from the UK rather than people already in Ireland.
  url: 'https://shearings.com/holidays/donegal-and-wild-atlantic-way-for-solo-travellers'
  last_checked: '2026-10-29'
  lat: 54.4669
  lng: -8.4497
  source: 'Operator website'

- title: 'Solo Ireland B&B self-drive holiday from the US'
  provider: 'Aer Lingus Vacation Store'
  town: Ennis
  county: Clare
  type: Package holiday
  price_basis: 'From $2,164 per person, 6 nights with flights from New York and car'
  supplement: none
  features: [meals_included]
  summary: 'A flight, car and B&B package from the US that is priced for one person, with no single supplement.'
  description: |
    Aimed at visitors from the United States, this package is specially priced for solo travellers. It includes return flights into Shannon and out of Dublin, a rental car, one night at Hotel Woodstock in Ennis (or similar) and five nights in B&Bs you choose along the way, with breakfast daily.

    It's a flexible way to see the west of Ireland at your own pace. Rates are non-refundable, so read the conditions before booking.
  url: 'https://www.aerlingusvacationstore.com/vacations/solo-travel-ireland-bed-breakfast-vacation'
  last_checked: '2026-10-29'
  lat: 52.8517
  lng: -8.9988
  source: 'Operator website'

