# Women-only small-group tours. Checked on the operator's page or in trade
# press on the last_checked date.

- title: 'Wild Women of Ireland: six days on the west coast'
  provider: 'Irish Experience Tours'
  town: Westport
  county: Mayo
  type: Guided tour
  price: 1799
  price_basis: 'per person, 6 days from Dublin. Ask about the single room price.'
  supplement: ask
  features: [women_only, group_activities]
  summary: 'An Irish-run, women-only small-group tour from Sligo to the Cliffs of Moher, with Achill, Westport, Connemara and Galway along the way.'
  description: |
    Irish Experience Tours describes this as the first women-only tour run by an Irish tour company. Over six days it travels from Dublin to Sligo, then down the west coast through Achill Island, Westport, Connemara, Galway and the Burren, before returning to Dublin by way of Clonmacnoise and Athlone.

